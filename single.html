<body data-page="single">
    <div class="banner-top container-fluid" id="home">

                <div class="col-md-6 logo-w3layouts text-center">

                        </a>
                    </h1>
                </div>
                <div class="col-md-3 top-info-cart text-right mt-lg-4">

                                        <input type="email" class="form-control" required="">
                                    </div>
                                    <div class="form-group">
                                        <label class="mb-2">Contraseña</label>
                                        <input type="password" class="form-control" required="">
                                    </div>
                                    <div class="form-check mb-2">
                                        <input type="checkbox" class="form-check-input" id="rememberCheckSingle">
                                        <label class="form-check-label" for="rememberCheckSingle">Recuérdame</label>

                                    <button type="submit" class="btn btn-primary submit mb-4">Acceder</button>
                                </form>

                        <i class="fas fa-search"></i>

                </div>

                    <button type="button" class="overlay-close">

                    </button>
                    <form action="#" method="post" class="d-flex">
                        <input class="form-control" type="search" placeholder="Buscar..." required="">
                        <button type="submit" class="btn btn-primary submit">
                            <i class="fas fa-search"></i>

                    </form>

            <nav class="navbar navbar-expand-lg navbar-light bg-light top-header mb-2">

                </div>

                    <div id="product-detail-content">
                        <h2 id="product-name">Detalle del producto</h2>
                        <p id="product-category" class="text-muted"></p>
                        <p id="product-reference" class="font-weight-bold"></p>
                        <h4 id="product-price" class="text-primary"></h4>
                        <p id="product-description"></p>
